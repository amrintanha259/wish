<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday!</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    text-align: center;
    background: linear-gradient(#ffe0f0, #e0f0ff);
    overflow: hidden;
  }

  /* Festoon flags */
  .bunting { display: flex; justify-content: center; flex-wrap: wrap; }
  .flag {
    width: 0; height: 0;
    border-left: 22px solid transparent;
    border-right: 22px solid transparent;
    border-top: 45px solid red;
    margin: 0 2px;
  }

  h1 {
    font-size: clamp(1.8rem, 6vw, 3rem);
    color: #d6336c;
    margin: 60px 15px 0;
    min-height: 1.3em;
  }
  p.sub {
    font-size: 1.3rem;
    color: #444;
    opacity: 0;
    transition: opacity 1.5s;
  }

  button {
    font-size: 1.2rem;
    padding: 14px 28px;
    border: none;
    border-radius: 30px;
    background: #d6336c;
    color: white;
    cursor: pointer;
    margin-top: 20px;
  }
  button:hover { background: #b02a5a; }

  /* Intro screen */
  #intro {
    position: fixed;
    inset: 0;
    background: linear-gradient(#ffe0f0, #e0f0ff);
    z-index: 30;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 1s;
  }
  #intro .big { font-size: 5rem; }
  #intro p { color: #444; font-size: 1.2rem; margin: 10px 20px; }

  /* Balloons */
  .balloon {
    position: fixed;
    bottom: -120px;
    width: 60px; height: 75px;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    animation: rise 6s linear forwards;
    z-index: 1;
  }
  @keyframes rise {
    to { transform: translateY(-120vh); }
  }

  /* Slideshow stage */
  #stage {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .card {
    background: white;
    padding: 20px;
    border-radius: 16px;
    max-width: 340px;
    width: 85%;
    opacity: 0;
    transform: scale(0.94);
    transition: opacity 1s, transform 1s;
  }
  .card.show { opacity: 1; transform: scale(1); }
  .imgbox { overflow: hidden; border-radius: 12px; }
  .card img {
    width: 100%;
    max-height: 55vh;
    object-fit: cover;
    display: block;
  }
  .card.zoom img { animation: zoom 8s linear forwards; }
  @keyframes zoom {
    from { transform: scale(1); }
    to   { transform: scale(1.12); }
  }
  .card h2 { color: #d6336c; }
  .card small { color: #888; }

  /* Final message screen */
  #finale {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    align-items: center;
    justify-content: center;
    z-index: 20;
    opacity: 0;
    transition: opacity 1.5s;
  }
  #finale.show { opacity: 1; }
  .final-card {
    background: white;
    padding: 30px 20px;
    border-radius: 20px;
    max-width: 340px;
    width: 85%;
  }
  .heart {
    font-size: 4.5rem;
    animation: beat 1.2s infinite;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }
  .final-card h2 { color: #d6336c; font-size: 1.8rem; margin: 10px 0; }
  .final-card p { color: #444; font-size: 1.2rem; margin: 8px 0; }
</style>
</head>
<body>

  <audio id="bgm" src="music.mp3.mp3" loop></audio>

  <!-- Intro screen -->
  <div id="intro">
    <div class="big">💌</div>
    <p>A little surprise for you...</p>
    <button onclick="startAll()">Tap to open 💌</button>
  </div>

  <div class="bunting" id="bunting"></div>

  <h1 id="title"></h1>
  <p class="sub" id="sub">Wishing you a day full of joy and happiness!</p>

  <!-- Photo slideshow -->
  <div id="stage">
    <div class="card" id="card">
      <div class="imgbox"><img id="wishImg" src="" alt="Birthday photo"></div>
      <h2 id="wishTitle"></h2>
      <p id="wishText"></p>
      <small id="wishCount"></small>
    </div>
  </div>

  <!-- Final message -->
  <div id="finale">
    <div class="final-card">
      <div class="heart">❤️</div>
      <h2>I love you!</h2>
      <p>Have a great birthday! 🎂🎉</p>
      <button onclick="startSlideshow()">Watch again 💌</button>
    </div>
  </div>

<script>
  // 1. Title text
  const titleText = "🎉 Happy Birthday, Dear Husband! 🎉";

  // 2. How long each photo stays (milliseconds). 5000 = 5 seconds
  const SLIDE_TIME = 5000;

  // 3. YOUR WISHES: edit photo names and messages here
  const wishes = [
    { img: "Photo1.jpg", title: "Happy Birthday! 🎂", text: "May your heart always find reasons to be happy." },
    { img: "Photo2.jpg", title: "Our memories 💛", text: "Miles apart, but never far from my heart." },
    { img: "Photo3.jpg", title: "Stay awesome! ✨", text: "You deserve all the beautiful things this world has to offer." },
    { img: "Photo4.jpg", title: "Best wishes! 🎁", text: "The best part of my life is that I get to love you." }
  ];

  const colors = ["#ff6b6b", "#feca57", "#48dbfb", "#1dd1a1", "#ff9ff3", "#a29bfe"];

  // Festoon flags
  const bunting = document.getElementById("bunting");
  for (let i = 0; i < 40; i++) {
    const flag = document.createElement("div");
    flag.className = "flag";
    flag.style.borderTopColor = colors[i % colors.length];
    bunting.appendChild(flag);
  }

  // Balloons
  function makeBalloon() {
    const b = document.createElement("div");
    b.className = "balloon";
    b.style.left = Math.random() * 95 + "vw";
    b.style.background = colors[Math.floor(Math.random() * colors.length)];
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 6000);
  }
  function burst(n) { for (let i = 0; i < n; i++) makeBalloon(); }
  setInterval(makeBalloon, 700);

  // Typing effect
  function typeText(el, text, speed) {
    return new Promise(resolve => {
      const chars = Array.from(text);
      let i = 0;
      el.textContent = "";
      const timer = setInterval(() => {
        el.textContent += chars[i];
        i++;
        if (i >= chars.length) { clearInterval(timer); resolve(); }
      }, speed);
    });
  }

  // Start everything after the first tap
  function startAll() {
    const intro = document.getElementById("intro");
    intro.style.opacity = 0;
    setTimeout(() => intro.style.display = "none", 1000);

    document.getElementById("bgm").play().catch(() => {});
    burst(15);

    typeText(document.getElementById("title"), titleText, 90).then(() => {
      document.getElementById("sub").style.opacity = 1;
      setTimeout(startSlideshow, 2500);
    });
  }

  // Automatic slideshow
  let current = 0;
  const stage = document.getElementById("stage");
  const card = document.getElementById("card");
  const finale = document.getElementById("finale");

  function startSlideshow() {
    finale.classList.remove("show");
    finale.style.display = "none";
    current = 0;
    stage.style.display = "flex";
    playSlide();
  }

  function playSlide() {
    if (current >= wishes.length) { finish(); return; }

    const w = wishes[current];
    card.classList.remove("show", "zoom");
    document.getElementById("wishImg").src = w.img;
    document.getElementById("wishTitle").textContent = w.title;
    document.getElementById("wishText").textContent = w.text;
    document.getElementById("wishCount").textContent = (current + 1) + " / " + wishes.length;

    setTimeout(() => {
      card.classList.add("show", "zoom");
      burst(5);
    }, 150);

    setTimeout(() => {
      card.classList.remove("show");
      setTimeout(() => { current++; playSlide(); }, 1000);
    }, SLIDE_TIME);
  }

  // Final "I love you" screen
  function finish() {
    stage.style.display = "none";
    finale.style.display = "flex";
    setTimeout(() => finale.classList.add("show"), 50);
    burst(30);
  }
</script>
</body>
</html>
